name: Temporary read-only chain audit

on:
  push:
    paths:
      - '.github/workflows/read-only-chain-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public blockchain explorers
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          BTC = [
              "1MYDZsaSTSMrU9NxPc19Z3wy5hr3jiS28b",
              "3Qdcs5MPro97Xej9w8b2EamWogQMTLvtxa",
          ]
          ETH = "0x9A12fEd4F690496E434175750ee3AA042e6456a1"
          UA = "th3nolo-self-audit/1.0 read-only"

          def get(url, timeout=30):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8"))

          def iso(ts):
              if ts is None:
                  return None
              return datetime.fromtimestamp(ts, timezone.utc).isoformat()

          def collect_blockscout(path, max_pages=200):
              base = f"https://eth.blockscout.com/api/v2/{path}"
              params = {}
              items = []
              pages = 0
              while pages < max_pages:
                  url = base + (("?" + urllib.parse.urlencode(params, doseq=True)) if params else "")
                  payload = get(url)
                  pages += 1
                  if isinstance(payload, dict):
                      page_items = payload.get("items", [])
                      if isinstance(page_items, list):
                          items.extend(page_items)
                      nxt = payload.get("next_page_params")
                      if not nxt:
                          break
                      params = nxt
                  elif isinstance(payload, list):
                      items.extend(payload)
                      break
                  else:
                      break
                  time.sleep(0.15)
              return {"items": items, "pages": pages}

          result = {
              "fetched_at": datetime.now(timezone.utc).isoformat(),
              "read_only": True,
              "bitcoin": [],
              "ethereum": {},
          }

          for address in BTC:
              summary = get(f"https://mempool.space/api/address/{address}")
              utxos = get(f"https://mempool.space/api/address/{address}/utxo")
              chain = summary.get("chain_stats", {})
              mempool = summary.get("mempool_stats", {})
              confirmed = int(chain.get("funded_txo_sum", 0)) - int(chain.get("spent_txo_sum", 0))
              unconfirmed = int(mempool.get("funded_txo_sum", 0)) - int(mempool.get("spent_txo_sum", 0))
              txs = []
              page = get(f"https://mempool.space/api/address/{address}/txs")
              if isinstance(page, list):
                  txs.extend(page)
                  page_count = 1
                  while page and page_count < 100:
                      confirmed_page = [x for x in page if x.get("status", {}).get("confirmed")]
                      if not confirmed_page:
                          break
                      last = confirmed_page[-1].get("txid")
                      if not last:
                          break
                      page = get(f"https://mempool.space/api/address/{address}/txs/chain/{last}")
                      if not isinstance(page, list) or not page:
                          break
                      txs.extend(page)
                      page_count += 1
                      time.sleep(0.15)
              else:
                  page_count = 0
              times = [x.get("status", {}).get("block_time") for x in txs if x.get("status", {}).get("block_time")]
              result["bitcoin"].append({
                  "address": address,
                  "confirmed_sats": confirmed,
                  "unconfirmed_sats": unconfirmed,
                  "final_sats": confirmed + unconfirmed,
                  "confirmed_btc": confirmed / 100_000_000,
                  "final_btc": (confirmed + unconfirmed) / 100_000_000,
                  "chain_tx_count": chain.get("tx_count"),
                  "mempool_tx_count": mempool.get("tx_count"),
                  "funded_sats": chain.get("funded_txo_sum"),
                  "spent_sats": chain.get("spent_txo_sum"),
                  "utxo_count": len(utxos) if isinstance(utxos, list) else None,
                  "utxo_sats": sum(int(x.get("value", 0)) for x in utxos) if isinstance(utxos, list) else None,
                  "first_confirmed_time": iso(min(times)) if times else None,
                  "latest_confirmed_time": iso(max(times)) if times else None,
                  "transactions_collected": len(txs),
                  "pages_collected": page_count,
                  "utxos": utxos,
              })

          eth_info = get(f"https://eth.blockscout.com/api/v2/addresses/{ETH}")
          counters = get(f"https://eth.blockscout.com/api/v2/addresses/{ETH}/counters")
          token_balances = get(f"https://eth.blockscout.com/api/v2/addresses/{ETH}/token-balances")
          txs = collect_blockscout(f"addresses/{ETH}/transactions")
          transfers = collect_blockscout(f"addresses/{ETH}/token-transfers")
          internals = collect_blockscout(f"addresses/{ETH}/internal-transactions")
          nfts = collect_blockscout(f"addresses/{ETH}/nft")

          def token_amount(row):
              raw = row.get("value")
              token = row.get("token") or {}
              decimals = token.get("decimals")
              try:
                  if raw is None:
                      return None
                  return int(raw) / (10 ** int(decimals or 0))
              except Exception:
                  return None

          parsed_balances = []
          balances_iter = token_balances if isinstance(token_balances, list) else token_balances.get("items", [])
          for row in balances_iter:
              token = row.get("token") or {}
              parsed_balances.append({
                  "name": token.get("name"),
                  "symbol": token.get("symbol"),
                  "type": token.get("type"),
                  "contract": token.get("address_hash") or token.get("address"),
                  "decimals": token.get("decimals"),
                  "raw_value": row.get("value"),
                  "amount": token_amount(row),
                  "fiat_value": row.get("value_in_fiat"),
                  "exchange_rate": token.get("exchange_rate"),
              })

          transfer_symbols = {}
          for row in transfers["items"]:
              token = row.get("token") or {}
              symbol = token.get("symbol") or token.get("name") or "UNKNOWN"
              transfer_symbols[symbol] = transfer_symbols.get(symbol, 0) + 1

          tx_times = []
          contract_creations = []
          for row in txs["items"]:
              ts = row.get("timestamp")
              if ts:
                  tx_times.append(ts)
              if row.get("created_contract"):
                  contract_creations.append(row.get("created_contract"))

          result["ethereum"] = {
              "address": ETH,
              "coin_balance_wei": eth_info.get("coin_balance"),
              "coin_balance_eth": int(eth_info.get("coin_balance") or 0) / 10**18,
              "exchange_rate_usd": eth_info.get("exchange_rate"),
              "estimated_eth_usd": (int(eth_info.get("coin_balance") or 0) / 10**18) * float(eth_info.get("exchange_rate") or 0),
              "is_contract": eth_info.get("is_contract"),
              "has_tokens": eth_info.get("has_tokens"),
              "has_token_transfers": eth_info.get("has_token_transfers"),
              "has_validated_blocks": eth_info.get("has_validated_blocks"),
              "counters": counters,
              "token_balances": parsed_balances,
              "token_balance_count": len(parsed_balances),
              "transactions_collected": len(txs["items"]),
              "transaction_pages": txs["pages"],
              "token_transfers_collected": len(transfers["items"]),
              "token_transfer_pages": transfers["pages"],
              "internal_transactions_collected": len(internals["items"]),
              "internal_transaction_pages": internals["pages"],
              "nft_items_collected": len(nfts["items"]),
              "nft_pages": nfts["pages"],
              "first_transaction_timestamp": min(tx_times) if tx_times else None,
              "latest_transaction_timestamp": max(tx_times) if tx_times else None,
              "created_contracts": contract_creations,
              "token_transfer_counts_by_symbol": transfer_symbols,
              "transactions": txs["items"],
              "token_transfers": transfers["items"],
              "internal_transactions": internals["items"],
              "nfts": nfts["items"],
          }

          print("CHAIN_AUDIT_JSON_BEGIN")
          print(json.dumps(result, indent=2, sort_keys=True))
          print("CHAIN_AUDIT_JSON_END")
          PY
